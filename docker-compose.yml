services:
  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4400}:80"
    depends_on:
      - api

  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      API_PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-torrent_shred_vault}
      DB_USER: ${POSTGRES_USER:-torrent_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-torrent_password}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-mail@arifmahmud.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-password}
      SHARE_VAULT_SECRET: ${SHARE_VAULT_SECRET:-change-this-share-secret}
      PEER_TRANSFER_SECRET: ${PEER_TRANSFER_SECRET:-change-this-peer-secret}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      UPDATER_URL: ${UPDATER_URL:-http://updater:3100}
      BACKUP_URL: ${BACKUP_URL:-http://backup:3200}
      SYNC_TRANSPORT_MODE: ${SYNC_TRANSPORT_MODE:-peer}
      PEER_DEFAULT_PORT: ${PEER_DEFAULT_PORT:-44888}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-vault-data}
    depends_on:
      - db
      - minio
      - updater
      - backup

  db:
    image: postgres:16-alpine
    container_name: torrent-shred-vault-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-torrent_shred_vault}
      POSTGRES_USER: ${POSTGRES_USER:-torrent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-torrent_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: torrent-shred-vault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data

  updater:
    build:
      context: ./updater
    restart: unless-stopped
    environment:
      UPDATE_REPO_URL: ${UPDATE_REPO_URL:-https://github.com/pranto48/torrent-shred-vault.git}
      UPDATE_REPO_BRANCH: ${UPDATE_REPO_BRANCH:-main}
      UPDATE_REPO_PATH: /workspace
      UPDATE_STATE_DIR: /state
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-torrent-shred-vault}
      ALLOW_DIRTY_UPDATE: ${ALLOW_DIRTY_UPDATE:-false}
    volumes:
      - .:/workspace
      - updater_state:/state
      - /var/run/docker.sock:/var/run/docker.sock

  backup:
    build:
      context: ./backup
    restart: unless-stopped
    environment:
      BACKUP_PORT: 3200
      BACKUP_DIR: /backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-change-this-backup-key}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-torrent_shred_vault}
      DB_USER: ${POSTGRES_USER:-torrent_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-torrent_password}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      SYNC_TRANSPORT_MODE: ${SYNC_TRANSPORT_MODE:-peer}
      PEER_DEFAULT_PORT: ${PEER_DEFAULT_PORT:-44888}
      MINIO_BUCKET: ${MINIO_BUCKET:-vault-data}
      UPDATE_REPO_URL: ${UPDATE_REPO_URL:-https://github.com/pranto48/torrent-shred-vault.git}
      UPDATE_REPO_BRANCH: ${UPDATE_REPO_BRANCH:-main}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-torrent-shred-vault}
    volumes:
      - backup_data:/backups
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db

volumes:
  postgres_data:
  minio_data:
  updater_state:
  backup_data:
